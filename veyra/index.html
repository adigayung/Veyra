<style>
:root{font:13px "Segoe UI",Tahoma,sans-serif;color:#222;--line:#c5c9cc;--blue:#2e6fc5}*{box-sizing:border-box}body{margin:0;background:#d7d7d7;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column;background:#eee;border:1px solid #888;box-shadow:0 1px 4px #777}.title{height:28px;background:linear-gradient(#fdfdfd,#dcdcdc);display:flex;align-items:center;padding-left:8px;font-size:12px}.title .logo{font-size:16px;margin-right:7px}.title strong{font-weight:400;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.window-btn{height:27px;width:45px;border:0;background:transparent;font-size:15px}.window-btn:hover{background:#c9dced}.close:hover{background:#d9534f;color:white}.menu{height:23px;border-top:1px solid #fff;border-bottom:1px solid #bbb;background:#f2f2f2;display:flex;align-items:center;padding:0 4px}.menu span{padding:3px 9px;cursor:pointer}.menu span:hover{background:#cce1f6}.toolbar{height:36px;display:flex;align-items:center;gap:3px;padding:2px 7px;border-bottom:1px solid #aaa;background:#e8e8e8}.tool{height:29px;min-width:29px;border:1px solid transparent;background:transparent;font-size:17px;color:#164a7c;border-radius:2px}.tool:hover,.tool.active{border-color:#8ab4de;background:#d8ebfb}.sep{height:24px;border-left:1px solid #bbb;margin:0 4px}.zoom{height:25px;width:60px;border:1px solid #aaa;background:white}.address{height:32px;display:flex;align-items:center;gap:4px;padding:3px 8px;background:#eee;border-bottom:1px solid #aaa}.nav{width:27px;height:25px;border:1px solid #bbb;background:#f7f7f7;font-size:16px}.path{flex:1;height:25px;border:1px solid #aaa;background:#fff;display:flex;align-items:center;padding:0 8px;color:#333}.path b{color:#765600;margin-right:7px}.refresh{width:30px}.body{flex:1;display:flex;min-height:0}.sidebar{width:244px;background:#fafafa;border-right:1px solid #aaa;display:flex;flex-direction:column;min-height:0;overflow:hidden}.explorer{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}.explorer-head{flex:0 0 auto;font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.4px;padding:5px 8px;background:#efefef;border-bottom:1px solid #ccc}.explorer-body{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 6px 12px 7px}.tree{list-style:none;padding:0;margin:0}.tree ul{list-style:none;padding-left:19px}.tree li{line-height:20px;white-space:nowrap;cursor:pointer}.twisty{display:inline-block;width:16px;color:#555}.folder{color:#b68400;font-size:15px;margin-right:4px}.tree .selected{background:#2675c7;color:white;border-radius:1px}.tree .selected .folder{color:#ffdf54}.viewer{flex:1;background:#fff;min-width:0;display:flex;flex-direction:column}.view-head{height:29px;border-bottom:1px solid #ccc;background:#f3f3f3;display:flex;align-items:center;padding:0 8px;color:#555}.view-head .count{margin-left:auto}.grid{padding:9px;overflow:auto;position:relative}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px;align-content:start}.grid-pad{height:0}.cell-pad{visibility:hidden}.card{padding:5px 5px 4px;border:1px solid transparent;border-radius:7px;cursor:pointer;max-width:160px;height:162px;overflow:hidden;display:flex;flex-direction:column}.card:hover{background:#edf5fd;border-color:#aac7e5}.card.selected{background:#e4f0fc;border:4px solid #2e6fc5;padding:2px 2px 1px}.thumb{height:108px;border:1px solid #aaa;border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#eee}.thumb svg{width:100%;height:100%}.thumb.locked-thumb,.thumb.broken{background:#f3f3f3;color:#999;font-size:22px}.meta{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}.filename{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.status{height:22px;background:#eee;border-top:1px solid #aaa;display:flex;align-items:center;font-size:11px}.status div{padding:2px 9px;border-right:1px solid #ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status .file{flex:1}.toast{position:fixed;bottom:32px;right:15px;background:#333;color:#fff;padding:8px 13px;border-radius:3px;opacity:0;transition:.2s}.toast.show{opacity:.9}
.path-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:0}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.grid .empty{padding:18px;color:#888}.grid .empty.error{color:#b03a2e}.tree .tree-error{color:#b03a2e;font-size:12px}.lock-badge{margin-left:4px}
.sortby-label{font-size:11px;color:#555;margin:0 2px 0 6px;white-space:nowrap}.sortby{height:25px;border:1px solid #aaa;background:white;font:inherit;font-size:12px;max-width:190px}
.groupfilter-label{font-size:11px;color:#555;margin:0 2px 0 6px;white-space:nowrap}.groupfilter{height:25px;border:1px solid #aaa;background:white;font:inherit;font-size:12px;max-width:170px}
.crypto-badge{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid #bbb;background:#f2f2f2;color:#555}.crypto-badge.open{border-color:#8fbf8f;background:#e7f5e7;color:#256b25}.crypto-badge.locked{border-color:#d0a0a0;background:#fbeaea;color:#9c3333}
.aimg-dialog{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#f2f2f2;border:1px solid #888;padding:16px;z-index:1000;min-width:400px;box-shadow:0 4px 12px #666}.aimg-dialog h3{margin:0 0 12px;font-size:14px}.aimg-dialog label{display:block;margin-bottom:4px;font-size:12px}.aimg-dialog input[type=text],.aimg-dialog input[type=password]{width:100%;padding:6px 8px;border:1px solid #aaa;background:#fff;font:inherit;margin-bottom:10px}.aimg-row{display:flex;gap:8px;margin-bottom:12px}.aimg-row button{flex:1;height:30px;font-size:12px}.aimg-status{font-size:11px;color:#555;min-height:16px;margin-bottom:6px}.aimg-progress{font-size:11px;color:#555}
.groups{flex:0 0 auto;max-height:42%;display:flex;flex-direction:column;min-height:0;overflow:auto;padding:5px 7px 7px;background:#f0f0f0;border-bottom:1px solid #aaa}

/* Native fullscreen owns the window chrome; this surface owns only the image.
   While it is active the whole application chrome (header/menu/toolbar/sidebar/
   status) is removed so the image is the ONLY visible content, with no black
   border coming from the UI layout. */
body.fs-active{background:#000}
body.fs-active .app{display:none}
/* width/height 100% + object-fit:contain = fill the screen as much as possible
   for both portrait and landscape while preserving the aspect ratio (no
   stretch/distort, no padding/margin). */
.fs-view img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:center center;cursor:grab;user-select:none;-webkit-user-drag:none}
.fs-view img:active{cursor:grabbing}

<body><main class="app">

<nav class="menu"></nav>
<section class="toolbar"><button class="tool" title="Open">📂</button><button class="tool">💾</button><button class="tool">🖨️</button><i class="sep"></i><button class="tool" data-action="zoom in">🔍＋</button><button class="tool" data-action="zoom out">🔍－</button><select class="zoom"><option>25%</option><option>50%</option><option>100%</option></select>

<button class="tool" id="btnAimg" title="Enkripsi/Dekripsi & Crypto Session">🔐</button><label class="sortby-label" for="sortBy">Sort By</label><select id="sortBy" class="sortby" title="Sort By — urutkan Image Grid/Thumbnail View">
<option value="date_desc">Date</option><option value="date_asc">(Date)</option><option value="name_asc" selected>File Name</option><option value="name_desc">(File Name)</option><option value="size_desc">File Size</option><option value="size_asc">(File Size)</option></select>

<option value="">Normal</option></select>

<span style="flex:1"></span><button class="tool">▦</button><button class="tool">▤</button><button class="tool">⛶</button></section>
<section class="address"><button class="nav" id="navBack" title="Back">←</button><button class="nav" id="navForward" title="Forward">→</button><button class="nav" id="navUp" title="Up">↑</button><div class="path"><b>📁</b><input id="pathInput" class="path-input" type="text" spellcheck="false" autocomplete="off" placeholder="Ketik path folder lalu tekan Enter" value=""></div><button class="nav refresh" id="refreshBtn" title="Refresh">↻</button></section>
<div class="body"><aside class="sidebar">
<div class="groups" id="groupsPanel"><div class="groups-head">Groups</div>

<ul class="group-list" id="groupList"></ul>
<div class="group-detail" id="groupDetail" hidden><div class="groups-head" id="groupDetailTitle">Members</div><button id="btnAddSelected" class="group-btn wide" title="Tambah file terpilih">＋ Tambah file terpilih</button><ul class="member-list" id="memberList"></ul></div>

<script>
(function(){
"use strict";
var els={
  menu:document.querySelector('.menu'),
  pathInput:document.getElementById('pathInput'),
  grid:document.getElementById('grid'),
  sortBy:document.getElementById('sortBy'),
  groupFilter:document.getElementById('groupFilter'),
  tree:document.getElementById('tree'),
  viewCount:document.getElementById('viewCount'),
  statusFile:document.getElementById('statusFile'),
  statusFolders:document.getElementById('statusFolders'),
  statusFiles:document.getElementById('statusFiles'),
  selectedStatus:document.getElementById('selectedStatus'),
  toast:document.getElementById('toast'),
  navBack:document.getElementById('navBack'),
  navForward:document.getElementById('navForward'),
  navUp:document.getElementById('navUp'),
  refreshBtn:document.getElementById('refreshBtn')
};

var state={path:null,images:[],rawImages:[],group:null,groupImages:[],sort:'name_asc',dirs:[],selected:null,selection:[],anchor:null,treeRoot:null,history:[],hIndex:-1,
  crypto:{unlocked:false,initialized:false,boundary:''},clipboard:null,
  fs:{index:null,mode:'actual',scale:1,tx:0,ty:0,natW:0,natH:0,dragging:false,moved:false,suppressClick:false,startX:0,startY:0,origX:0,origY:0}};

var GRID_MIN=142, GRID_GAP=8;
// Large-dataset virtualisation: only a window of GRID_WINDOW_RADIUS items
// around the viewport centre is ever mounted, and the DOM is refreshed only
// GRID_SCROLL_DEBOUNCE ms after scrolling actually stops (a direct jump).
var GRID_WINDOW_RADIUS=30, GRID_SCROLL_DEBOUNCE=250;
var gridLayout={rowH:170,calibrated:false,winStart:-1,winEnd:-1,scrollTimer:null};

// -- small helpers ---------------------------------------------------------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtSize(bytes){if(bytes==null||isNaN(bytes))return '';var u=['B','KB','MB','GB'],i=0,n=Number(bytes);while(n>=1024&&i<u.length-1){n/=1024;i++;}return (i===0?n:(n<10?n.toFixed(1):Math.round(n)))+' '+u[i];}
function imgUrl(p){return '/api/image?path='+encodeURIComponent(p);}
function thumbUrl(p){return '/api/thumb?path='+encodeURIComponent(p);}
function toast(msg){var t=els.toast;t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1600);}
function parentPath(p){if(!p)return null;var s=p.replace(/[\\\/]+$/,'');var i=Math.max(s.lastIndexOf('\\'),s.lastIndexOf('/'));if(i<=0)return null;var par=s.slice(0,i);if(/^[A-Za-z]:$/.test(par))return par+'\\';return par;}

function getJSON(url,opts){return fetch(url,opts).then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});});}
function postJSON(url,body){return getJSON(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body||{})});}

// -- typing / modal guards -------------------------------------------------
// Keyboard shortcuts (Delete, Ctrl+C/X/V, arrow navigation) must never fire
// while the user is editing an input/textarea/select or while a modal is open.
function isEditableTarget(t){
  if(!t)return false;
  var tag=(t.tagName||'').toUpperCase();
  return tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable===true;
}
function anyDialogVisible(){
  try{if(aimgDialog&&aimgDialog.style.display==='block')return true;}catch(e){}
  try{if(dialogs&&dialogs.some(function(d){return d.style.display==='block';}))return true;}catch(e){}
  return false;
}

// -- menu ------------------------------------------------------------------
els.menu.innerHTML=['File','Edit','Colors','Effects','View','Tag','Rating','Favorites','Create','Tools','Settings','Help'].map(function(x){return '<span>'+x+'</span>';}).join('');
els.menu.querySelectorAll('span').forEach(function(s){s.onclick=function(){toast(s.textContent+' menu');};});

// -- crypto session ui -----------------------------------------------------
function setCryptoStatus(info){
  if(info){state.crypto.unlocked=!!info.unlocked;state.crypto.initialized=!!info.initialized;if(info.boundary)state.crypto.boundary=info.boundary;}
  // The crypto badge lived in the old desktop title bar, which the native
  // shell/WebView2 now owns. Update it only if some container still defines it
  // (never assume it exists, so a missing element can't abort initialization).
  var b=document.getElementById('cryptoBadge');
  if(b){b.textContent=state.crypto.unlocked?'🔓 Unlocked':'🔒 Locked';b.className='crypto-badge '+(state.crypto.unlocked?'open':'locked');}
  var cs=document.getElementById('cryptoStatus');
  if(cs){cs.textContent=(state.crypto.unlocked?'Crypto session TERBUKA':'Crypto session TERKUNCI')+' · '+(state.crypto.initialized?'vault tersedia':'belum ada vault')+' · boundary: '+(state.crypto.boundary||'-');}
  var enc=document.getElementById('btnEncrypt'),dec=document.getElementById('btnDecrypt'),lk=document.getElementById('btnLock'),ul=document.getElementById('btnUnlock');
  if(enc)enc.disabled=!state.crypto.unlocked;
  if(dec)dec.disabled=!state.crypto.unlocked;
  if(lk)lk.disabled=!state.crypto.unlocked;
  if(ul)ul.disabled=state.crypto.unlocked;
}

// -- browse / viewer -------------------------------------------------------
function showGridError(msg){
  els.grid.innerHTML='<div class="empty error">'+esc(msg)+'</div>';
  els.viewCount.textContent='0 items';
  state.images=[];state.rawImages=[];state.dirs=[];state.selected=null;state.selection=[];state.anchor=null;
  els.statusFolders.textContent='0 Folders';
  els.statusFiles.textContent='0 Files (0 B)';
  els.statusFile.textContent='No image selected';
  els.selectedStatus.textContent='0 Selected';
}

function openFolder(path,opts){
  opts=opts||{};
  var url='/api/browse'+(path?('?path='+encodeURIComponent(path)):'');
  return getJSON(url).then(function(res){
    var data=res.data||{};
    if(data.crypto){setCryptoStatus(data.crypto);}
    if(!data.ok){
      showGridError(data.error||'Tidak dapat membuka folder.');
      toast(data.error||'Tidak dapat membuka folder.');
      return;
    }
    state.path=data.path;
    // Keep the untouched filesystem listing, then expose the *sorted* view as
    // ``state.images`` - the only array the grid / viewer / selection use.
    state.rawImages=data.images||[];
    state.images=sortImages(state.rawImages,state.sort||'name_asc');
    // A Group filter is a *persistent* dataset: while a group is active the
    // grid keeps showing that group's members even when the explorer moves to
    // another folder/drive (the Normal/explorer listing never leaks into the
    // active group view).  Selecting "Normal" restores the explorer dataset.
    if(state.group!=null){state.images=sortImages(activeSource(),state.sort||'name_asc');}
    state.dirs=data.directories||[];
    state.selected=null;state.selection=[];state.anchor=null;
    els.statusFile.textContent='No image selected';
    if(data.tree_root&&!state.treeRoot){state.treeRoot=data.tree_root;}
    els.pathInput.value=data.path;

    renderGrid();
    updateStatus();
    markSelectedDir(data.path);
    syncTree(data.path);
    if(opts.history!==false){pushHistory(data.path);}
  }).catch(function(err){
    showGridError('Gagal membuka folder: '+err.message);
    toast('Gagal membuka folder: '+err.message);
  });
}

function pushHistory(p){
  if(state.hIndex>=0&&state.history[state.hIndex]===p)return;
  state.history=state.history.slice(0,state.hIndex+1);
  state.history.push(p);
  state.hIndex=state.history.length-1;
}

// -- virtualized grid ------------------------------------------------------
function computeCols(){
  var w=els.grid.clientWidth-18;
  if(w<=0){w=els.grid.clientWidth||600;}
  return Math.max(1,Math.floor((w+GRID_GAP)/(GRID_MIN+GRID_GAP)));
}

function cardHtml(img,index){
  var dims=(img.width&&img.height)?(img.width+'×'+img.height):'—';
  var type=esc(img.type||'');
  var badge=img.encrypted?'<span class="lock-badge" title="AIMG">🔒</span>':'';
  var inner;
  if(img.encrypted&&!state.crypto.unlocked){
    inner='<div class="thumb locked-thumb" title="Crypto session terkunci">🔒</div>';
  }else{
    inner='<div class="thumb"><img loading="lazy" alt="'+esc(img.name)+'" src="'+thumbUrl(img.path)+'"></div>';
  }
  return '<article class="card" data-index="'+index+'">'+inner+
    '<div class="meta"><span class="dims">'+dims+'</span><span>'+type+badge+'</span></div>'+
    '<div class="filename" title="'+esc(img.name)+'">'+esc(img.name)+'</div></article>';
}

// Empty grid cell used to keep the partial first/last rows of the render
// window in the correct columns (it is never a .card, so the thumbnail DOM
// stays bounded to the window itself).
function padCellHtml(){return '<div class="cell-pad" aria-hidden="true"></div>';}

// Column the grid uses to pick the "centre" item of a row.
function gridMidCol(cols){return Math.max(0,Math.floor((cols-1)/2));}

// The image sitting closest to the vertical+horizontal centre of the viewport.
function computeCenterIndex(){
  var total=state.images.length;
  if(!total)return -1;
  var cols=computeCols();
  var rowH=gridLayout.rowH||170;
  var rows=Math.ceil(total/cols);
  var viewH=els.grid.clientHeight||600;
  var centerY=els.grid.scrollTop+viewH/2;
  var centerRow=Math.floor(centerY/rowH);
  if(centerRow<0)centerRow=0;
  if(centerRow>rows-1)centerRow=rows-1;
  var idx=centerRow*cols+gridMidCol(cols);
  if(idx>total-1)idx=total-1;
  if(idx<0)idx=0;
  return idx;
}

function renderGrid(){
  gridLayout.calibrated=false;
  gridLayout.winStart=-1;gridLayout.winEnd=-1;
  if(gridLayout.scrollTimer){clearTimeout(gridLayout.scrollTimer);gridLayout.scrollTimer=null;}
  els.grid.innerHTML='';
  els.grid.onscroll=null;
  if(!state.images.length){
    els.grid.innerHTML='<div class="empty">Tidak ada file gambar yang didukung di folder ini.</div>';
    return;
  }
  var top=document.createElement('div');top.className='grid-pad';top.id='gridTop';
  var inner=document.createElement('div');inner.className='vgrid';inner.id='gridInner';
  var bottom=document.createElement('div');bottom.className='grid-pad';bottom.id='gridBottom';
  els.grid.appendChild(top);els.grid.appendChild(inner);els.grid.appendChild(bottom);
  renderWindow(computeCenterIndex());
  els.grid.onscroll=onGridScroll;
}

// Mount ONLY ``center - GRID_WINDOW_RADIUS`` .. ``center + GRID_WINDOW_RADIUS``
// (about 60-61 items).  This is a *direct jump*: the previously mounted window
// is discarded wholesale - it is never walked through item by item - so jumping
// across thousands of images costs a single re-render, not a cascade.  Spacer
// cells keep the partial first/last rows aligned to their columns, and the
// top/bottom pads preserve the full scrollable height for the scrollbar.
function renderWindow(center){
  var inner=document.getElementById('gridInner');
  if(!inner)return;
  var total=state.images.length;
  if(!total)return;
  if(gridLayout.scrollTimer){clearTimeout(gridLayout.scrollTimer);gridLayout.scrollTimer=null;}
  var cols=computeCols();
  var rowH=gridLayout.rowH||170;
  var rows=Math.ceil(total/cols);
  if(center==null||center<0||center>=total)center=computeCenterIndex();
  if(center<0)center=0;
  var start=Math.max(0,center-GRID_WINDOW_RADIUS);
  var end=Math.min(total-1,center+GRID_WINDOW_RADIUS);
  gridLayout.winStart=start;gridLayout.winEnd=end;
  var startRow=Math.floor(start/cols);
  var endRow=Math.floor(end/cols);
  var alignEnd=Math.min(total-1,endRow*cols+cols-1);
  var lead=start-startRow*cols;
  var trail=(cols-1)-(alignEnd%cols);
  var parts=[];
  var k;
  for(k=0;k<lead;k++){parts.push(padCellHtml());}
  for(k=start;k<=end;k++){parts.push(cardHtml(state.images[k],k));}
  for(k=0;k<trail;k++){parts.push(padCellHtml());}
  inner.innerHTML=parts.join('');
  var top=document.getElementById('gridTop'),bottom=document.getElementById('gridBottom');
  if(top)top.style.height=(startRow*rowH)+'px';
  if(bottom)bottom.style.height=Math.max(0,(rows-endRow-1))*rowH+'px';
  bindCards();
  if(!gridLayout.calibrated){
    gridLayout.calibrated=true;
    var probe=inner.querySelector('.card');
    if(probe){
      var h=probe.getBoundingClientRect().height;
      if(h>0.5&&Math.abs((h+GRID_GAP)-rowH)>1){gridLayout.rowH=h+GRID_GAP;renderWindow(computeCenterIndex());return;}
    }
  }
}

// The scrollbar itself must stay instant: we keep no work on the scroll event
// (no re-render), only (re)arm a timer.  Every further scroll resets the timer,
// so the window is recomputed once the user has genuinely stopped.
function onGridScroll(){
  if(gridLayout.scrollTimer){clearTimeout(gridLayout.scrollTimer);}
  gridLayout.scrollTimer=setTimeout(applyScrollWindow,GRID_SCROLL_DEBOUNCE);
}

// Runs GRID_SCROLL_DEBOUNCE ms after the last scroll event: compute the newest
// centre and jump straight to its window - unless the centre is still inside
// the already mounted window, in which case nothing needs to happen.
function applyScrollWindow(){
  gridLayout.scrollTimer=null;
  var center=computeCenterIndex();
  if(center<0)return;
  if(gridLayout.winStart>=0&&center>=gridLayout.winStart&&center<=gridLayout.winEnd){return;}
  renderWindow(center);
}

function bindCards(){
  els.grid.querySelectorAll('.card').forEach(function(card){
    card.onclick=function(e){handleCardClick(Number(card.dataset.index),e);};
    card.ondblclick=function(){openFullScreen(Number(card.dataset.index));};
  });
  els.grid.querySelectorAll('.thumb img').forEach(function(im){
    im.addEventListener('load',function(){
      var card=im.closest('.card');if(!card)return;
      var idx=Number(card.dataset.index);
      var item=state.images[idx];
      if(item&&!item.encrypted&&im.naturalWidth&&im.naturalHeight){
        var span=card.querySelector('.dims');
        if(span&&span.textContent==='—'){span.textContent=im.naturalWidth+'×'+im.naturalHeight;item.width=im.naturalWidth;item.height=im.naturalHeight;}
      }
    });
    im.addEventListener('error',function(){
      var thumb=im.closest('.thumb');
      if(thumb){thumb.classList.add('broken');thumb.textContent='⚠';im.remove();}
    });
  });
  applySelectionClasses();
}

function selectIndex(i){
  if(i<0||i>=state.images.length)return;
  state.selected=i;state.selection=[i];state.anchor=i;
  var card=els.grid.querySelector('.card[data-index="'+i+'"]');
  if(!card){ensureVisible(i);return;}
  applySelectionClasses();
  var img=state.images[i];
  els.statusFile.textContent=img.name;
  updateStatus();
}

function ensureVisible(i){
  var cols=computeCols();
  var row=Math.floor(i/cols);
  var y=row*gridLayout.rowH;
  var viewH=els.grid.clientHeight||600;
  if(y<els.grid.scrollTop||y+gridLayout.rowH>els.grid.scrollTop+viewH){
    els.grid.scrollTop=Math.max(0,y-gridLayout.rowH);
  }
  renderWindow(i);
  applySelectionClasses();
}

function updateStatus(){
  var total=state.images.reduce(function(a,b){return a+(b.size||0);},0);
  els.statusFolders.textContent=state.dirs.length+' Folders';
  els.statusFiles.textContent=state.images.length+' Files ('+fmtSize(total)+')';
  var n=state.selection.length;
  if(n===1&&state.images[state.selection[0]]){
    els.selectedStatus.textContent='1 Selected ('+fmtSize(state.images[state.selection[0]].size)+')';
  }else if(n>1){
    var bytes=0;state.selection.forEach(function(idx){var it=state.images[idx];if(it)bytes+=(it.size||0);});
    els.selectedStatus.textContent=n+' Selected ('+fmtSize(bytes)+')';
  }else{
    els.selectedStatus.textContent='0 Selected';
  }
  els.viewCount.textContent=state.images.length+' items';
}

// -- grid sorting (Sort By) ------------------------------------------------
// Sort By only reorders the Image Grid / Thumbnail View.  It sorts the WHOLE
// filesystem listing (real metadata: name / size / modified_at) and then reuses
// the very same virtual grid, so only the active window is mounted and a sort
// change costs a single bounded render - exactly like a scroll jump.  No new
// subsystem: the existing /api/browse data is the only source of the list.
var SORT_MODES={
  date_desc:'Date',            // newest -> oldest
  date_asc:'(Date)',           // oldest -> newest
  name_asc:'File Name',        // A -> Z
  name_desc:'(File Name)',     // Z -> A
  size_desc:'File Size',       // largest -> smallest
  size_asc:'(File Size)'       // smallest -> largest
};
function sortNum(v){return(v==null||isNaN(v))?0:Number(v);}
function compareNames(a,b){
  var x=String((a&&a.name)||'').toLowerCase(),y=String((b&&b.name)||'').toLowerCase();
  if(x<y)return -1;if(x>y)return 1;return 0;
}
// Pure helper: returns a NEW sorted array (never mutates the raw listing).
function sortImages(list,mode){
  var arr=(list||[]).slice();
  var cmp;
  if(mode==='date_desc')cmp=function(a,b){return sortNum(b.modified_at)-sortNum(a.modified_at);};
  else if(mode==='date_asc')cmp=function(a,b){return sortNum(a.modified_at)-sortNum(b.modified_at);};
  else if(mode==='size_desc')cmp=function(a,b){return sortNum(b.size)-sortNum(a.size);};
  else if(mode==='size_asc')cmp=function(a,b){return sortNum(a.size)-sortNum(b.size);};
  else if(mode==='name_desc')cmp=function(a,b){return compareNames(b,a);};
  else cmp=compareNames;
  arr.sort(cmp);
  return arr;
}
// The dataset the Image Grid (and therefore the Image View navigation) consumes
// is the ACTIVE one: the Group selector picks the source - "Normal" -> the live
// File-Explorer listing, a group -> that group's members (a logical collection
// that may span folders/drives) - and Sort By then orders it.  ``state.images``
// is always derived from this one pipeline, so the grid and the Image View can
// never disagree about the order.
function activeSource(){
  return (state.group!=null)?(state.groupImages||[]):(state.rawImages||[]);
}
// Re-sort the active dataset and refresh the grid.  Selection is preserved by
// *file path* (indices move when the order changes) and the grid returns to the
// top so the new order is visible from the first item.  Virtualisation is
// preserved: renderGrid() only mounts the window around the new centre.
function rebuildImages(){
  var picked={};
  getSelectedImages().forEach(function(it){if(it&&it.path)picked[it.path]=true;});
  state.images=sortImages(activeSource(),state.sort||'name_asc');
  var sel=[];
  state.images.forEach(function(it,idx){if(it&&it.path&&picked[it.path]){sel.push(idx);}});
  state.selection=sel;
  state.anchor=sel.length?sel[0]:null;
  state.selected=sel.length?sel[sel.length-1]:null;
  if(els.grid)els.grid.scrollTop=0;
  renderGrid();
  updateStatus();
  updateStatusFile();
}
function applySortBy(mode){
  if(!Object.prototype.hasOwnProperty.call(SORT_MODES,mode))mode=state.sort||'name_asc';
  state.sort=mode;
  rebuildImages();
  if(els.sortBy)els.sortBy.value=mode;
}
if(els.sortBy){els.sortBy.onchange=function(){applySortBy(this.value);};}

// -- sidebar tree ----------------------------------------------------------
// The explorer mirrors Windows Explorer: a "This PC" root that lists every
// available drive, then lazily expanded folders at unlimited depth.
var PC_PATH='::pc';

function loadTree(){
  els.tree.innerHTML='';
  var pc=buildPcNode();
  els.tree.appendChild(pc);
  return expandNode(pc);
}

function buildPcNode(){
  var li=document.createElement('li');
  li.dataset.kind='pc';
  li.dataset.path=PC_PATH;
  li.dataset.loaded='0';
  var twisty=document.createElement('span');
  twisty.className='twisty';
  twisty.textContent='⊞';
  var icon=document.createElement('span');
  icon.className='folder';
  icon.textContent='💻';
  li.appendChild(twisty);
  li.appendChild(icon);
  li.appendChild(document.createTextNode('This PC'));
  twisty.addEventListener('click',function(e){e.stopPropagation();toggleNode(li);});
  li.addEventListener('click',function(e){e.stopPropagation();toggleNode(li);});
  return li;
}

function buildTreeList(folders){
  var ul=document.createElement('ul');
  for(var i=0;i<folders.length;i++){ul.appendChild(buildTreeNode(folders[i]));}
  return ul;
}

function buildTreeNode(folder){
  var li=document.createElement('li');
  li.dataset.kind=folder.kind||'folder';
  li.dataset.path=folder.path;
  li.dataset.loaded='0';
  var twisty=document.createElement('span');
  twisty.className='twisty';
  twisty.textContent=folder.has_children?'⊞':'';
  var icon=document.createElement('span');
  icon.className='folder';
  icon.textContent=(folder.kind==='drive')?'💽':'📁';
  li.appendChild(twisty);
  li.appendChild(icon);
  li.appendChild(document.createTextNode(folder.name));
  twisty.addEventListener('click',function(e){e.stopPropagation();toggleNode(li);});
  li.addEventListener('click',function(e){e.stopPropagation();selectTreeNode(li);openFolder(folder.path);});
  return li;
}

function nodeTwisty(li){return li.querySelector(':scope > .twisty');}
function nodeChildren(li){return li.querySelector(':scope > ul');}
function setTwisty(li,sym){var t=nodeTwisty(li);if(t)t.textContent=sym;}

// Fetch (once) the immediate children of ``li`` and mount them collapsed.
function loadChildren(li){
  if(li.dataset.loaded==='1')return Promise.resolve();
  var isPc=li.dataset.kind==='pc';
  var url=isPc?'/api/drives':('/api/tree?path='+encodeURIComponent(li.dataset.path));
  return getJSON(url).then(function(res){
    var data=res.data||{};
    var items=isPc?(data.drives||[]):(data.folders||[]);
    if(isPc){items=items.map(function(d){return {name:d.name,path:d.path,has_children:true,kind:'drive'};});}
    li.dataset.loaded='1';
    var prev=nodeChildren(li);
    if(prev)prev.remove();
    if(!items.length){setTwisty(li,'');return;}
    li.appendChild(buildTreeList(items));
    setTwisty(li,'⊞');
  }).catch(function(){li.dataset.loaded='1';setTwisty(li,'');});
}

// Expand a node, loading its children on first use.
function expandNode(li){
  var ul=nodeChildren(li);
  if(ul){ul.removeAttribute('hidden');setTwisty(li,'⊟');return Promise.resolve();}
  return loadChildren(li).then(function(){
    var nu=nodeChildren(li);
    if(nu){nu.removeAttribute('hidden');setTwisty(li,'⊟');}
  });
}

function toggleNode(li){
  var ul=nodeChildren(li);
  if(ul){
    if(ul.hasAttribute('hidden')){ul.removeAttribute('hidden');setTwisty(li,'⊟');}
    else{ul.setAttribute('hidden','');setTwisty(li,'⊞');}
    return Promise.resolve();
  }
  if(li.dataset.kind!=='pc'){
    var t=nodeTwisty(li);
    if(!t||!t.textContent){return Promise.resolve();}
  }
  return loadChildren(li).then(function(){
    var nu=nodeChildren(li);
    if(nu)setTwisty(li,'⊟');
  });
}

function selectTreeNode(li){
  els.tree.querySelectorAll('li').forEach(function(x){x.classList.remove('selected');});
  li.classList.add('selected');
}

function markSelectedDir(path){
  els.tree.querySelectorAll('li').forEach(function(li){
    if(li.dataset.path===path){li.classList.add('selected');}
    else{li.classList.remove('selected');}
  });
}

function findTreeNode(path){
  var found=null;
  els.tree.querySelectorAll('li[data-path]').forEach(function(li){
    if(!found&&li.dataset.path===path)found=li;
  });
  return found;
}

// Cumulative prefixes of an absolute path, drive root first
// (e.g. "J:\a\b" -> ["J:\", "J:\a", "J:\a\b"]).
function pathChain(path){
  var norm=String(path).replace(/\//g,'\\');
  var out=[];
  var m=norm.match(/^([a-zA-Z]:)\\?/);
  var start=0;
  if(m){out.push(m[1]+'\\');start=m[0].length;}
  var parts=norm.slice(start).split('\\').filter(function(p){return p.length;});
  var cur=out.length?out[0]:'';
  for(var i=0;i<parts.length;i++){
    cur=cur.replace(/\\+$/,'')+'\\'+parts[i];
    out.push(cur);
  }
  return out;
}

function revealTowards(prev,childPath){
  return prev.then(function(parent){
    if(!parent)return null;
    return expandNode(parent).then(function(){return findTreeNode(childPath)||null;});
  });
}

// Expand "This PC", the drive and every ancestor so ``path`` becomes visible.
function revealTreePath(path){
  var chain=pathChain(path);
  var pc=els.tree.querySelector('li[data-kind="pc"]');
  if(!pc||!chain.length)return Promise.resolve();
  return expandNode(pc).then(function(){
    var node=findTreeNode(chain[0]);
    if(!node)return null;
    var p=Promise.resolve(node);
    for(var i=1;i<chain.length;i++){p=revealTowards(p,chain[i]);}
    return p;
  });
}

// Reload one folder's children in the sidebar so a newly created folder shows
// up immediately. When ``opts.expand`` is set the node is left expanded.
function refreshTreeNode(path,opts){
  opts=opts||{};
  if(!path)return Promise.resolve();
  var li=findTreeNode(path);
  if(!li)return Promise.resolve();
  var oldUl=nodeChildren(li);
  var wasOpen=!!oldUl&&!oldUl.hasAttribute('hidden');
  return getJSON('/api/tree?path='+encodeURIComponent(path)).then(function(res){
    var data=res.data||{};
    var folders=(data.ok&&data.folders)?data.folders:[];
    var prev=nodeChildren(li);
    if(prev)prev.remove();
    li.dataset.loaded='1';
    if(!folders.length){setTwisty(li,'');return;}
    var ul=buildTreeList(folders);
    var open=wasOpen||!!opts.expand;
    if(!open)ul.setAttribute('hidden','');
    li.appendChild(ul);
    setTwisty(li,open?'⊟':'⊞');
  }).catch(function(){});
}

// Keep the explorer in sync with the folder the viewer is showing: refresh an
// existing node, otherwise expand its ancestors (drive first) so the folder
// becomes visible and navigable in the tree.
function syncTree(path){
  if(!path)return;
  if(findTreeNode(path)){return refreshTreeNode(path);}
  revealTreePath(path).then(function(){markSelectedDir(path);});
}

// keyboard: fullscreen navigation/zoom + prev/next selection + Escape to exit
document.addEventListener('keydown',function(e){
  // Escape is the ONLY primary way out of native fullscreen. It must not close
  // the app and must not reload the page; it simply restores the normal viewer
  // (chrome comes back, image/selection/navigation state is preserved).
  if(e.key==='Escape'){
    if(fsActive()){
      e.preventDefault();
      e.stopPropagation();
      closeFullScreen();
      return;
    }
    return; // let other Escape handlers (context menu, dialogs) run
  }
  // While fullscreen, arrow/page keys navigate images and +/-/0 zoom; the
  // grid-selection shortcuts below must not run on the hidden grid.
  if(fsActive()){
    if(isEditableTarget(e.target))return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '||e.key==='Spacebar'){
      e.preventDefault();fsStep(1);return;
    }
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){
      e.preventDefault();fsStep(-1);return;
    }
    if(e.key==='+'||e.key==='='){e.preventDefault();fsZoom(1.25);return;}
    if(e.key==='-'||e.key==='_'){e.preventDefault();fsZoom(0.8);return;}
    if(e.key==='0'){e.preventDefault();fsSetMode('actual');return;}
    return;
  }
  if(isEditableTarget(e.target)||anyDialogVisible())return;
  if(!state.images.length)return;
  var cols=computeCols();
  var cur=(state.selected==null)?-1:state.selected;
  var next=null;
  if(e.key==='ArrowRight'){next=(cur<0)?0:cur+1;}
  else if(e.key==='ArrowLeft'){next=(cur<0)?0:cur-1;}
  else if(e.key==='ArrowDown'){next=(cur<0)?0:cur+cols;}
  else if(e.key==='ArrowUp'){next=(cur<0)?0:cur-cols;}
  if(next==null)return;
  e.preventDefault();
  next=Math.max(0,Math.min(state.images.length-1,next));
  if(e.shiftKey&&state.anchor!=null){
    var a=Math.min(state.anchor,next),b=Math.max(state.anchor,next),r=[];
    for(var k=a;k<=b;k++)r.push(k);
    state.selection=r;state.selected=next;applySelectionClasses();updateStatus();updateStatusFile();
  }else{
    selectIndex(next);
  }
});

async function doUnlock(){
  var pass=document.getElementById('aimgPass').value;
  if(!pass){document.getElementById('aimgStatus').textContent='Password wajib diisi.';return;}
  setAimgBusy(true);
  document.getElementById('aimgStatus').textContent='Mengunlock...';
  try{
    var res=await postJSON('/api/aimg/unlock',{password:pass});
    if(res.data&&res.data.ok){
      document.getElementById('aimgStatus').textContent='Crypto session terbuka.';
      document.getElementById('aimgPass').value='';
      setCryptoStatus(res.data);
      if(state.path){openFolder(state.path,{history:false});}
    }else{
      document.getElementById('aimgStatus').textContent='Unlock gagal: '+((res.data&&res.data.error)||'unknown');
    }
  }catch(err){document.getElementById('aimgStatus').textContent='Error: '+err.message;}
  setAimgBusy(false);
}

async function doLock(){
  setAimgBusy(true);
  try{
    var res=await postJSON('/api/aimg/lock',{});
    setCryptoStatus(res.data);
    document.getElementById('aimgStatus').textContent='Crypto session terkunci.';
    if(state.path){openFolder(state.path,{history:false});}
  }catch(err){document.getElementById('aimgStatus').textContent='Error: '+err.message;}
  setAimgBusy(false);
}

async function runAimg(op){
  if(!state.crypto.unlocked){document.getElementById('aimgStatus').textContent='Crypto session terkunci. Unlock dulu.';return;}
  var path=document.getElementById('aimgPath').value.trim();
  if(!path&&state.path)path=state.path;
  if(!path){document.getElementById('aimgStatus').textContent='Pilih folder terlebih dahulu.';return;}
  setAimgBusy(true);
  document.getElementById('aimgStatus').textContent=op==='encrypt'?'Mengenkripsi...':'Mendekripsi...';
  document.getElementById('aimgProgress').textContent='';
  try{
    var res=await postJSON('/api/aimg/'+op,{path:path});
    var data=res.data||{};
    if(data.ok){
      document.getElementById('aimgStatus').textContent=op==='encrypt'?'Enkripsi selesai.':'Dekripsi selesai.';
      document.getElementById('aimgProgress').textContent='Ditemukan: '+data.found+', Berhasil: '+data.success+', Gagal: '+data.failed;
      if(data.errors&&data.errors.length){document.getElementById('aimgProgress').textContent+=' (detail di console)';console.warn('AIMG errors:',data.errors);}
      if(state.path){openFolder(state.path,{history:false});}
    }else{
      document.getElementById('aimgStatus').textContent=data.error||'Operasi gagal.';
    }
  }catch(err){document.getElementById('aimgStatus').textContent='Error: '+err.message;}
  setAimgBusy(false);

// -- groups (database backed) ----------------------------------------------
var groupsState={list:[],selected:null,detail:null};

function loadGroups(){
  return getJSON('/api/groups').then(function(res){
    var data=res.data||{};
    groupsState.list=data.groups||[];
    renderGroups();
    renderGroupFilter();
    if(groupsState.selected!=null){
      var still=groupsState.list.some(function(g){return g.id===groupsState.selected;});
      if(still){openGroup(groupsState.selected);}
      else{groupsState.selected=null;groupsState.detail=null;renderGroupDetail();}
    }
    // Keep the Image-Grid group dataset in sync with the DB: a still-existing
    // group is re-read from the DB (members may have changed), a deleted one
    // falls back to the Normal (explorer) dataset.
    if(state.group!=null){
      if(groupsState.list.some(function(g){return g.id===state.group;})){selectGroupDataset(state.group);}
      else{resetToNormalDataset();}
    }
  }).catch(function(err){toast('Gagal memuat group: '+err.message);});
}

function renderGroups(){
  var host=document.getElementById('groupList');
  if(!groupsState.list.length){host.innerHTML='<li class="group-empty">Belum ada group.</li>';return;}
  host.innerHTML=groupsState.list.map(function(g){
    return '<li data-id="'+g.id+'" class="'+(g.id===groupsState.selected?'selected':'')+'">'+
      '<span class="gname" title="'+esc(g.name)+'">'+esc(g.name)+'</span>'+
      '<span class="gcount" title="Jumlah member">'+g.member_count+'</span>'+
      '<button class="mini" data-act="rename" title="Rename">\u270e</button>'+
      '<button class="mini" data-act="delete" title="Delete">\ud83d\uddd1</button></li>';
  }).join('');
  host.querySelectorAll('li[data-id]').forEach(function(li){
    var id=Number(li.dataset.id);
    li.querySelector('.gname').onclick=function(){openGroup(id);};
    li.querySelector('.gcount').onclick=function(){openGroup(id);};
    li.querySelector('[data-act="rename"]').onclick=function(e){e.stopPropagation();renameGroup(id);};
    li.querySelector('[data-act="delete"]').onclick=function(e){e.stopPropagation();deleteGroup(id);};
  });
}

function renderGroupDetail(){
  var panel=document.getElementById('groupDetail');
  var d=groupsState.detail;
  if(!d){panel.hidden=true;return;}
  panel.hidden=false;
  document.getElementById('groupDetailTitle').textContent='Members \u00b7 '+d.name+' ('+d.members.length+')';
  var host=document.getElementById('memberList');
  if(!d.members.length){host.innerHTML='<li class="group-empty">Belum ada member.</li>';return;}
  host.innerHTML=d.members.map(function(m){
    return '<li><span class="mflag">'+(m.is_aimg?'\ud83d\udd12':'\ud83d\uddbc')+'</span>'+
      '<span class="mname" title="'+esc(m.path)+'">'+esc(m.name)+'</span>'+
      '<button class="mini" data-fid="'+m.id+'" title="Remove from group">\u2715</button></li>';
  }).join('');
  host.querySelectorAll('button[data-fid]').forEach(function(b){
    b.onclick=function(){removeMember(Number(b.dataset.fid));};
  });
}

function openGroup(id){
  groupsState.selected=id;
  renderGroups();
  getJSON('/api/groups/detail?id='+id).then(function(res){
    var data=res.data||{};
    if(data.ok){groupsState.detail=data.group;}
    else{groupsState.detail=null;toast(data.error||'Group tidak ditemukan.');}
    renderGroupDetail();
  }).catch(function(err){toast('Gagal memuat group: '+err.message);});
}

function createGroup(){
  var input=document.getElementById('groupName');
  var name=(input.value||'').trim();
  if(!name){toast('Nama group wajib diisi.');return;}
  postJSON('/api/groups',{name:name}).then(function(res){
    var data=res.data||{};
    if(data.ok){input.value='';toast('Group dibuat.');loadGroups();}
    else{toast(data.error||'Gagal membuat group.');}
  }).catch(function(err){toast('Gagal membuat group: '+err.message);});
}

function renameGroup(id){
  var current=groupsState.list.filter(function(x){return x.id===id;})[0];
  var name=prompt('Rename group:',current?current.name:'');
  if(name==null)return;
  name=name.trim();
  if(!name){toast('Nama group wajib diisi.');return;}
  postJSON('/api/groups/rename',{id:id,name:name}).then(function(res){
    var data=res.data||{};
    if(data.ok){toast('Group di-rename.');loadGroups();}
    else{toast(data.error||'Gagal rename.');}
  }).catch(function(err){toast('Gagal rename: '+err.message);});
}

function deleteGroup(id){
  if(!confirm('Hapus group ini? File fisik tidak akan dihapus.'))return;
  postJSON('/api/groups/delete',{id:id}).then(function(res){
    var data=res.data||{};
    if(data.ok){
      toast('Group dihapus ('+data.memberships_removed+' membership).');

function addSelectedToGroup(){
  if(groupsState.selected==null){toast('Pilih group dulu.');return;}
  if(state.selected==null||!state.images[state.selected]){toast('Pilih file dulu di grid.');return;}

    else{toast(data.error||'Gagal menambah file.');}

function removeMember(fileId){

  postJSON('/api/groups/remove',{id:groupsState.selected,file_id:fileId}).then(function(res){
    var data=res.data||{};
    if(data.ok){toast('Membership dihapus.');openGroup(groupsState.selected);loadGroups();}
    else{toast(data.error||'Gagal menghapus membership.');}

// -- group filter (Image Grid dataset selector) ----------------------------
// The Group control sits right of Sort By.  "Normal" (always first) shows the
// live File-Explorer listing; each group below switches the grid to that
// group's members (a logical collection that may span folders/drives).  The
// last three entries are actions.  Everything is DB backed through the EXISTING
// Group subsystem: the list comes from GET /api/groups and the members from
// GET /api/groups/detail - no second model and no duplicate database logic.
var GROUP_SEP='\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500';

function renderGroupFilter(){
  var sel=els.groupFilter;
  if(!sel)return;
  var html='<option value="">Normal</option>';
  if(groupsState.list.length){
    html+='<option value="__sep1" disabled>'+GROUP_SEP+'</option>';
    groupsState.list.forEach(function(g){
      html+='<option value="'+g.id+'">'+esc(g.name)+' ('+g.member_count+')</option>';
    });
  }
  html+='<option value="__sep2" disabled>'+GROUP_SEP+'</option>';
  html+='<option value="__add">Add Group</option>';
  html+='<option value="__edit">Edit Group</option>';
  html+='<option value="__remove">Remove Group</option>';
  sel.innerHTML=html;

}

function syncGroupFilterValue(){
  if(els.groupFilter)els.groupFilter.value=(state.group!=null)?String(state.group):'';
}

// Map a DB group member (GroupService._file_dict) onto the same image shape the
// grid/viewer consume from /api/browse (ImageInfo.to_dict), so Sort By and the
// Image View behave identically for a group dataset.
function groupMemberToImage(m){
  return {
    name:m.name,
    path:m.path,
    size:m.size||0,
    modified_at:Date.parse(m.modified)||0,
    type:String(m.extension||'').toUpperCase(),
    encrypted:!!m.is_aimg,
    width:0,
    height:0,
    groupFileId:m.id
  };
}

function resetToNormalDataset(){
  state.group=null;
  state.groupImages=[];
  groupsState.selected=null;groupsState.detail=null;renderGroupDetail();
  renderGroups();
  rebuildImages();
  syncGroupFilterValue();
}

function selectGroupDataset(id){
  return getJSON('/api/groups/detail?id='+id).then(function(res){
    var data=res.data||{};
    if(!data.ok||!data.group){toast(data.error||'Group tidak ditemukan.');syncGroupFilterValue();return;}
    groupsState.selected=id;groupsState.detail=data.group;renderGroups();renderGroupDetail();
    state.group=id;
    state.groupImages=(data.group.members||[]).map(groupMemberToImage);
    rebuildImages();
    syncGroupFilterValue();
  }).catch(function(err){toast('Gagal memuat group: '+err.message);syncGroupFilterValue();});
}

function applyGroupFilter(value){
  if(value==='__add'){createGroupPrompt();return;}
  if(value==='__edit'){renameActiveGroup();return;}
  if(value==='__remove'){removeActiveGroup();return;}
  if(value==null||value===''){resetToNormalDataset();return;}
  selectGroupDataset(Number(value));
}

function createGroupPrompt(){
  var name=prompt('Nama group baru:');

    var data=res.data||{};

function removeActiveGroup(){

// -- multi selection helpers ----------------------------------------------
function getSelectedIndices(){
  return state.selection.slice().sort(function(a,b){return a-b;});
}
function getSelectedImages(){
  return getSelectedIndices().map(function(i){return state.images[i];}).filter(function(x){return !!x;});
}
function primarySelectedIndex(){
  if(state.selected!=null&&state.images[state.selected])return state.selected;
  if(state.selection.length)return state.selection[state.selection.length-1];
  return null;
}
function applySelectionClasses(){
  var has={};state.selection.forEach(function(i){has[i]=true;});
  els.grid.querySelectorAll('.card').forEach(function(c){
    if(has[Number(c.dataset.index)])c.classList.add('selected');else c.classList.remove('selected');
  });
}
function updateStatusFile(){
  var idx=primarySelectedIndex();
  els.statusFile.textContent=(idx!=null&&state.images[idx])?state.images[idx].name:'No image selected';
}
function handleCardClick(i,e){
  e=e||{};
  if(e.ctrlKey||e.metaKey){
    var pos=state.selection.indexOf(i);
    if(pos>=0)state.selection.splice(pos,1);else state.selection.push(i);
    state.selection.sort(function(a,b){return a-b;});
    state.anchor=i;
  }else if(e.shiftKey&&state.anchor!=null){
    var a=Math.min(state.anchor,i),b=Math.max(state.anchor,i),r=[];
    for(var k=a;k<=b;k++)r.push(k);
    state.selection=r;
  }else{
    state.selection=[i];state.anchor=i;
  }
  state.selected=i;
  applySelectionClasses();
  updateStatus();
  updateStatusFile();
}

// -- file operations (existing service/API layer) -------------------------
function apiCopy(paths,target){return postJSON('/api/files/copy',{paths:paths,target:target});}
function apiMove(paths,target){return postJSON('/api/files/move',{paths:paths,target:target});}
function apiRename(path,name){return postJSON('/api/files/rename',{path:path,name:name});}
function apiNewFolder(parent,name){return postJSON('/api/files/newfolder',{parent:parent,name:name});}
function apiEncryptFiles(paths){return postJSON('/api/aimg/encrypt-files',{paths:paths});}
function apiDecryptFiles(paths){return postJSON('/api/aimg/decrypt-files',{paths:paths});}
function apiRemoveFiles(paths){return postJSON('/api/files/delete',{paths:paths});}

function setClipboard(mode){
  var imgs=getSelectedImages();
  if(!imgs.length){toast('Pilih file dulu.');return;}
  state.clipboard={mode:mode,paths:imgs.map(function(x){return x.path;})};
  toast((mode==='cut'?'Cut ':'Copy ')+imgs.length+' file.');
}
function pasteClipboard(){
  if(!state.clipboard||!state.clipboard.paths.length){toast('Clipboard kosong.');return;}
  if(!state.path){toast('Tidak ada folder aktif.');return;}
  var move=state.clipboard.mode==='cut';
  var url=move?'/api/files/move':'/api/files/copy';
  var paths=state.clipboard.paths;
  postJSON(url,{paths:paths,target:state.path}).then(function(res){
    var data=res.data||{};
    if(data.ok){
      toast((move?'Dipindah ':'Disalin ')+((data.moved||0)+(data.copied||0))+' file.');
      if(move)state.clipboard=null;
      if(state.path)openFolder(state.path,{history:false});
    }else{toast(data.error||'Paste gagal.');}
  }).catch(function(err){toast('Error: '+err.message);});
}

function removeSelectedFiles(){
  var imgs=getSelectedImages();
  if(!imgs.length){toast('Pilih file dulu.');return;}
  var ask=imgs.length>1?
    'Hapus '+imgs.length+' file terpilih?\n\n'+imgs.map(function(x){return x.name;}).join('\n'):
    'Hapus file "'+imgs[0].name+'"?';
  if(!confirm(ask))return;
  var paths=imgs.map(function(x){return x.path;});
  apiRemoveFiles(paths).then(function(res){
    var data=res.data||{};
    if(!data.ok){toast(data.error||'Hapus gagal.');return;}
    var done=data.deleted||0,fail=data.failed||0;
    toast('Dihapus: '+done+(fail?(' ('+fail+' gagal)'):''));
    state.selection=[];state.selected=null;state.anchor=null;
    applySelectionClasses();updateStatus();updateStatusFile();
    if(state.path){
      openFolder(state.path,{history:false}).then(function(){
        refreshTreeNode(state.path,{expand:true});
      });
    }
    loadGroups();
  }).catch(function(err){toast('Error: '+err.message);});
}

var dialogs=[];
function makeDialog(key,title,buildBody,onOk){
  var d=document.createElement('div');
  d.className='modal-dialog';d.dataset.key=key;
  d.innerHTML='<h3>'+esc(title)+'</h3><div class="dlg-body"></div>'+
    '<div class="aimg-row"><button class="tool" data-dlg-ok>OK</button>'+
    '<button class="tool" data-dlg-cancel>Cancel</button></div>';
  buildBody(d.querySelector('.dlg-body'),d);
  document.body.appendChild(d);
  d.querySelector('[data-dlg-ok]').onclick=function(){onOk(d);};
  d.querySelector('[data-dlg-cancel]').onclick=function(){d.style.display='none';};
  dialogs.push(d);
  return d;
}
function showDialog(d){
  d.style.display='block';
  var f=d.querySelector('input');
  if(f){f.focus();if(f.select)f.select();}
}
function hideAllDialogs(){dialogs.forEach(function(d){d.style.display='none';});}

function batchPlan(imgs, prefix, suffix, numbering, start, pad){
  var out=[];
  for(var i=0;i<imgs.length;i++){
    var base=imgs[i].name, ext='';
    var dot=base.lastIndexOf('.');if(dot>0)ext=base.substring(dot);
    var seq='';
    if(numbering){
      seq=String(start+i);
      while(seq.length<pad)seq='0'+seq;
    }
    out.push({old:base, name:prefix+seq+suffix+ext});
  }
  return out;
}
function batchFormValues(){
  var prefix=document.getElementById('batchPrefix').value;
  var suffix=document.getElementById('batchSuffix').value;
  var numEl=document.getElementById('batchNumbering');
  var numbering=!!(numEl&&numEl.checked);
  var start=parseInt(document.getElementById('batchStart').value,10);
  var pad=parseInt(document.getElementById('batchPad').value,10);
  if(isNaN(start)||start<0)start=1;
  if(isNaN(pad)||pad<0)pad=0;
  return {prefix:prefix,suffix:suffix,numbering:numbering,start:start,pad:pad};
}
function setBatchStatus(msg){var el=document.getElementById('batchStatus');if(el)el.textContent=msg||'';}
function updateBatchPreview(){
  var imgs=(batchDialog&&batchDialog._items)||[];
  var host=document.getElementById('batchPreview');
  if(!host)return;
  if(!imgs.length){host.innerHTML='<div class="dlg-note">Tidak ada file terpilih.</div>';return;}
  var v=batchFormValues();
  var plan=batchPlan(imgs,v.prefix,v.suffix,v.numbering,v.start,v.pad);
  host.innerHTML='<b>'+imgs.length+' file terpilih:</b><br>'+
    plan.map(function(x){return esc(x.old)+' \u2192 '+esc(x.name);}).join('<br>');
}
var batchDialog=makeDialog('batch','Batch Rename',function(body){
  body.innerHTML=
    '<label>Prefix</label>'+
    '<input id="batchPrefix" type="text" placeholder="mis. image_">'+
    '<label>Suffix</label>'+
    '<input id="batchSuffix" type="text" placeholder="mis. _final">'+
    '<label><input id="batchNumbering" type="checkbox" checked> Tambahkan nomor urut</label>'+
    '<label>Nomor awal</label>'+
    '<input id="batchStart" type="number" value="1" min="0">'+
    '<label>Zero padding (jumlah digit)</label>'+
    '<input id="batchPad" type="number" value="3" min="0">'+
    '<div class="dlg-note" id="batchPreview"></div>'+
    '<div class="dlg-note" id="batchStatus"></div>';
  body.querySelectorAll('input').forEach(function(el){
    el.addEventListener('input',updateBatchPreview);
    el.addEventListener('change',updateBatchPreview);
  });
},function(d){
  var imgs=batchDialog._items||[];
  if(!imgs.length){setBatchStatus('Tidak ada file terpilih.');return;}
  var v=batchFormValues();
  var paths=imgs.map(function(x){return x.path;});
  setBatchStatus('Memproses...');
  postJSON('/api/files/batch-rename',{
    paths:paths,prefix:v.prefix,suffix:v.suffix,numbering:v.numbering,start:v.start,padding:v.pad
  }).then(function(res){
    var data=res.data||{};
    if(!data.ok){setBatchStatus(data.error||'Batch rename gagal.');return;}
    var msg='Rename: '+(data.renamed||0)+' berhasil';
    if(data.unchanged)msg+=', '+data.unchanged+' tanpa perubahan';
    if(data.failed)msg+=', '+data.failed+' gagal';
    msg+='.';
    setBatchStatus(msg);toast(msg);
    d.style.display='none';
    state.selection=[];state.selected=null;state.anchor=null;
    if(state.path){
      openFolder(state.path,{history:false}).then(function(){refreshTreeNode(state.path,{expand:true});});
    }
    loadGroups();
  }).catch(function(err){setBatchStatus('Error: '+err.message);});
});
function openBatchRenameDialog(){
  var imgs=getSelectedImages();

      d.style.display='none';
      if(state.path)openFolder(state.path,{history:false});
    }else{toast(data.error||'Operasi gagal.');}
  }).catch(function(err){toast('Error: '+err.message);});
});
function openTargetFolderDialog(op){
  if(!getSelectedImages().length){toast('Pilih file dulu.');return;}
  targetDialog.dataset.op=op;
  targetDialog.querySelector('h3').textContent=(op==='move'?'Move to Folder...':'Copy to Folder...');
  document.getElementById('targetFolder').value=state.path||'';
  showDialog(targetDialog);
}

var newFolderDialog=makeDialog('newfolder','New Folder',function(body){
  body.innerHTML='<label>Nama folder baru</label>'+
    '<input id="newFolderName" type="text" placeholder="Nama folder">';
},function(d){
  var name=document.getElementById('newFolderName').value.trim();
  if(!name){toast('Nama folder wajib diisi.');return;}

    if(data.ok){

      var parent=state.path;
      // Reload the listing and refresh the explorer so the new folder shows up
      // (and can be opened) without a manual page reload.
      openFolder(parent,{history:false}).then(function(){refreshTreeNode(parent,{expand:true});});
    }
    else{toast(data.error||'Gagal membuat folder.');}
  }).catch(function(err){toast('Error: '+err.message);});

function openNewFolderDialog(){

}

var renameDialog=makeDialog('rename','Rename',function(body){

},function(d){

    else{toast(data.error||'Gagal rename.');}
  }).catch(function(err){toast('Error: '+err.message);});
});
function openRenameDialog(){

// -- encrypt / decrypt selected files (Tools -> Encrypt / Decrypt) ---------
// The modal shows a password field plus the list of files taken from the
// selection at the moment the menu was opened.  Validation happens both here
// (clear feedback; a .aimg is never offered to Encrypt and a plain image is
// never offered to Decrypt) and on the server (the endpoint only ever touches
// files of the matching type).
function cryptoValidSelection(op){
  var sel=getSelectedImages();
  if(op==='decrypt')return sel.filter(function(x){return !!x.encrypted;});
  return sel.filter(function(x){return !x.encrypted;});
}
function setCryptoFilesStatus(msg){
  var el=document.getElementById('cryptoFilesStatus');
  if(el)el.textContent=msg||'';
}
function runCryptoFiles(op,paths,password){
  var seq=Promise.resolve();
  if(password&&!state.crypto.unlocked){
    seq=postJSON('/api/aimg/unlock',{password:password}).then(function(res){
      var data=res.data||{};
      if(!data.ok)throw new Error(data.error||'Unlock gagal.');
      setCryptoStatus(data);
    });
  }
  return seq.then(function(){
    return postJSON(op==='decrypt'?'/api/aimg/decrypt-files':'/api/aimg/encrypt-files',
      {paths:paths});
  });
}
var cryptoFilesDialog=makeDialog('cryptofiles','Encrypt',function(body){},function(d){
  var op=d.dataset.op||'encrypt';
  var imgs=cryptoValidSelection(op);
  if(!imgs.length){setCryptoFilesStatus('Tidak ada file yang sesuai pada pilihan.');return;}
  var pass=document.getElementById('cryptoFilesPass').value;
  if(!state.crypto.unlocked&&!pass){setCryptoFilesStatus('Password wajib untuk membuka crypto session.');return;}
  var paths=imgs.map(function(x){return x.path;});
  setCryptoFilesStatus((op==='decrypt'?'Mendekripsi ':'Mengenkripsi ')+paths.length+' file...');
  runCryptoFiles(op,paths,pass).then(function(res){
    var data=res.data||{};
    if(data.ok){
      var skip=data.skipped||0;
      var summary=(op==='decrypt'?'Dekripsi':'Enkripsi')+': '+(data.success||0)+' berhasil'+
        (data.failed?(', '+data.failed+' gagal'):'')+(skip?(', '+skip+' dilewati'):'')+'.';
      setCryptoFilesStatus(summary);
      toast(summary);
      if(state.path)openFolder(state.path,{history:false});
      if(!data.failed)d.style.display='none';
    }else{
      setCryptoFilesStatus(data.error||'Operasi gagal.');
    }
  }).catch(function(err){setCryptoFilesStatus('Error: '+err.message);});
});
function openCryptoFilesDialog(op){
  op=(op==='decrypt')?'decrypt':'encrypt';
  var sel=getSelectedImages();
  if(!sel.length){toast('Pilih file dulu.');return;}
  var valid=cryptoValidSelection(op);
  var rejected=sel.length-valid.length;
  if(!valid.length){
    toast(op==='decrypt'
      ? 'Hanya file .aimg yang dapat didekripsi.'
      : 'Hanya image biasa yang didukung yang dapat dienkripsi.');
    return;
  }
  cryptoFilesDialog.dataset.op=op;
  cryptoFilesDialog.querySelector('h3').textContent=(op==='decrypt'?'Decrypt Files':'Encrypt Files');
  var rows=valid.slice(0,40).map(function(x){return '<li>'+esc(x.name)+'</li>';}).join('');
  var body=cryptoFilesDialog.querySelector('.dlg-body');
  body.innerHTML=
    '<label>Password crypto session</label>'+
    '<input id="cryptoFilesPass" type="password" placeholder="Password crypto session">'+
    '<div class="dlg-note">'+(op==='decrypt'
      ? 'File .aimg yang akan didekripsi ('+valid.length+'):'
      : 'Image yang akan dienkripsi ('+valid.length+'):')+'</div>'+
    '<ul class="file-list">'+rows+'</ul>'+
    (valid.length>40?('<div class="dlg-note">... +'+(valid.length-40)+' file lain</div>'):'')+
    (rejected?('<div class="dlg-warn">'+rejected+' file dilewati karena jenisnya tidak sesuai.</div>'):'')+
    '<div class="dlg-note" id="cryptoFilesStatus"></div>';
  showDialog(cryptoFilesDialog);
}

// -- full screen viewer (zoom + pan) --------------------------------------
var fsView=document.createElement('div');
fsView.className='fs-view';
// Fullscreen surface: only the image is visible. No UI chrome.
fsView.innerHTML='<img id="fsImg" alt="">';
document.body.appendChild(fsView);
var fsImg=document.getElementById('fsImg');
// View-Image geometry. ``mode`` is 'actual' (native 100%) or 'fitwidth';
// ``scale`` is the zoom relative to the native pixel size; tx/ty is the pan
// offset in CSS px.  natW/natH are the real pixel dimensions, read on load.
function fsViewport(){return {w:fsView.clientWidth||0,h:fsView.clientHeight||0};}
function fsDisplayedSize(){var s=state.fs.scale||1;return {w:(state.fs.natW||0)*s,h:(state.fs.natH||0)*s};}
function fsClamp(){
  var vp=fsViewport();
  if(!(vp.w>0)||!(vp.h>0))return;                 // no viewport (detached/headless)
  var d=fsDisplayedSize();
  // The flex container keeps the image centred, so on each axis it may only
  // travel half of the overflow.  Clamping both ends makes the image behave
  // like a sheet *inside* a box: its edges never pull away from the viewport,
  // so panning can never expose black space.
  var maxX=Math.max(0,(d.w-vp.w)/2);
  var maxY=Math.max(0,(d.h-vp.h)/2);
  if(state.fs.tx>maxX)state.fs.tx=maxX;else if(state.fs.tx<-maxX)state.fs.tx=-maxX;
  if(state.fs.ty>maxY)state.fs.ty=maxY;else if(state.fs.ty<-maxY)state.fs.ty=-maxY;
}
function fsApply(){
  fsClamp();
  fsImg.style.transform='translate('+state.fs.tx+'px,'+state.fs.ty+'px) scale('+state.fs.scale+')';
}
// Size the image box to its native pixels (100%).  The zoom is baked into the
// transform scale, so the element's aspect ratio always equals the image's
// (object-fit:contain then fills the box exactly - no stretch/distortion).
function fsSizeToNatural(){
  var w=state.fs.natW||0,h=state.fs.natH||0;
  if(w>0&&h>0){fsImg.style.width=w+'px';fsImg.style.height=h+'px';}
}
// A single left click toggles ACTUAL SIZE <-> FIT WIDTH; each mode resets the
// pan so the new fit always starts centred.
function fsSetMode(mode){
  state.fs.mode=mode;
  var vp=fsViewport();
  if(mode==='fitwidth'&&(state.fs.natW||0)>0&&vp.w>0){state.fs.scale=vp.w/state.fs.natW;}
  else{state.fs.scale=1;}
  state.fs.tx=0;state.fs.ty=0;
  fsApply();
}
function fsToggleMode(){fsSetMode(state.fs.mode==='fitwidth'?'actual':'fitwidth');}
fsImg.addEventListener('load',function(){
  if(!fsActive())return;
  state.fs.natW=fsImg.naturalWidth||0;
  state.fs.natH=fsImg.naturalHeight||0;
  fsSizeToNatural();
  if(state.fs.mode==='fitwidth')fsSetMode('fitwidth');else fsApply();
});
function openFullScreen(i){
  if(i==null||!state.images[i])return;
  var item=state.images[i];
  if(item.encrypted&&!state.crypto.unlocked){toast('Crypto session terkunci. Unlock dulu (\ud83d\udd10).');return;}
  // OPEN always starts at ACTUAL SIZE (100%), centred, and clears any zoom/pan
  // from the previous image so it can never bleed into the next one.
  state.fs.index=i;state.fs.mode='actual';state.fs.scale=1;state.fs.tx=0;state.fs.ty=0;
  state.fs.natW=0;state.fs.natH=0;state.fs.dragging=false;state.fs.moved=false;state.fs.suppressClick=false;
  state.selected=i;state.selection=[i];state.anchor=i;applySelectionClasses();updateStatus();updateStatusFile();
  fsImg.style.width='';fsImg.style.height='';
  fsImg.src=imgUrl(item.path); // .aimg streams decrypted bytes from CryptoSession (in memory)
  fsApply();
  fsView.classList.add('show');
  document.body.classList.add('fs-active');
  // Enter TRUE native fullscreen via the pywebview bridge (window.toggle_fullscreen):
  // the window frame/title bar, app chrome and the Windows taskbar are covered.
  if(window.__aether_fs && window.__aether_fs.enter){
    try{window.__aether_fs.enter();}catch(err){}
  }
}
function fsActive(){return fsView.classList.contains('show');}
function closeFullScreen(){
  // Leave native fullscreen via the pywebview bridge, then restore the chrome.
  if(window.__aether_fs && window.__aether_fs.leave){
    try{window.__aether_fs.leave();}catch(err){}
  }
  fsView.classList.remove('show');
  document.body.classList.remove('fs-active');
  fsImg.removeAttribute('src');
  fsImg.style.width='';fsImg.style.height='';
  state.fs.index=null;state.fs.mode='actual';state.fs.scale=1;state.fs.tx=0;state.fs.ty=0;state.fs.dragging=false;state.fs.moved=false;state.fs.suppressClick=false;
}
function fsStep(delta){
  if(state.fs.index==null)return;
  var n=state.fs.index+delta;
  if(n<0||n>=state.images.length)return;
  openFullScreen(n);
}
function fsZoom(factor){
  var old=state.fs.scale||1;
  var next=Math.max(0.1,Math.min(32,old*factor));
  var k=next/old;
  state.fs.scale=next;
  // Zoom about the viewport centre (the point beneath it stays put), then clamp.
  state.fs.tx=state.fs.tx*k;state.fs.ty=state.fs.ty*k;
  fsApply();
}
// Single LEFT click on the image: toggle Actual Size <-> Fit Width.
// Double click on the image: leave View Image (back to the grid).  A pan drag
// sets suppressClick so releasing the mouse after dragging never toggles.
fsImg.addEventListener('click',function(e){
  if(!fsActive()||e.button!==0)return;
  if(state.fs.suppressClick){state.fs.suppressClick=false;return;}
  fsToggleMode();
});
fsImg.addEventListener('dblclick',function(e){
  if(!fsActive())return;
  e.preventDefault();
  closeFullScreen();
});
fsImg.addEventListener('mousedown',function(e){
  if(!fsActive())return;
  if(e.button!=null&&e.button!==0)return;   // left button only
  e.preventDefault();
  if(e.stopPropagation)e.stopPropagation();
  state.fs.dragging=true;state.fs.moved=false;
  state.fs.startX=e.clientX;state.fs.startY=e.clientY;
  state.fs.origX=state.fs.tx;state.fs.origY=state.fs.ty;
});
document.addEventListener('mousemove',function(e){
  if(!state.fs.dragging)return;
  var dx=e.clientX-state.fs.startX,dy=e.clientY-state.fs.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3)state.fs.moved=true;
  state.fs.tx=state.fs.origX+dx;
  state.fs.ty=state.fs.origY+dy;
  fsApply();
});
document.addEventListener('mouseup',function(){
  if(!state.fs.dragging)return;
  if(state.fs.moved)state.fs.suppressClick=true;
  state.fs.dragging=false;
});
// Mouse wheel scrolls through the ACTIVE ordered dataset (Normal/Group filter
// -> Sort By -> ordered list): the very same order the Image Grid shows.
// Wheel DOWN moves forward (next item = higher index) and wheel UP moves
// backward (previous item = lower index); the direction never flips with the
// sort kind - it simply walks the current ordered list.  Each freshly opened
// image starts again at ACTUAL SIZE (see openFullScreen).
fsView.addEventListener('wheel',function(e){
  if(!fsActive())return;
  e.preventDefault();
  if(e.deltaY>0)fsStep(1);else fsStep(-1);
},{passive:false});
// Keep the clamped geometry correct when the viewport changes (e.g. the native
// window toggling fullscreen).  Guarded so a headless DOM stub has no window.
if(typeof window!=='undefined'&&typeof window.addEventListener==='function'){
  window.addEventListener('resize',function(){
    if(!fsActive())return;
    if(state.fs.mode==='fitwidth')fsSetMode('fitwidth');else fsApply();
  });
}

// -- right click context menu ---------------------------------------------
var ctxMenu=document.createElement('div');
ctxMenu.className='ctx-menu';
ctxMenu.innerHTML=
  '<div class="ctx-item" data-act="fullscreen">Open Full Screen</div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item has-sub" data-act="tools">Tools<span class="arrow">\u25b6</span>'+
    '<div class="ctx-sub"><div class="ctx-item" data-act="batch-rename">Batch Rename...</div></div>'+
  '</div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item" data-act="encrypt">Encrypt</div>'+
  '<div class="ctx-item" data-act="decrypt">Decrypt</div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item has-sub" data-act="addgroup">Add to Group<span class="arrow">\u25b6</span><div class="ctx-sub" id="ctxAddGroup"></div></div>'+
  '<div class="ctx-item has-sub" data-act="removegroup">Remove from Group<span class="arrow">\u25b6</span><div class="ctx-sub" id="ctxRemoveGroup"></div></div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item" data-act="copytarget">Copy to Folder...</div>'+
  '<div class="ctx-item" data-act="movetarget">Move to Folder...</div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item" data-act="copy">Copy</div>'+
  '<div class="ctx-item" data-act="cut">Cut</div>'+
  '<div class="ctx-item" data-act="paste">Paste</div>'+
  '<div class="ctx-item" data-act="remove">Remove</div>'+
  '<div class="ctx-item" data-act="newfolder">New Folder</div>'+
  '<div class="ctx-sep"></div>'+
  '<div class="ctx-item" data-act="rename">Rename</div>';
document.body.appendChild(ctxMenu);

function ctxItem(act){return ctxMenu.querySelector('.ctx-item[data-act="'+act+'"]');}
function buildContextMenu(){
  var sel=getSelectedImages();
  var n=sel.length;
  var allPlain=n>0&&sel.every(function(x){return !x.encrypted;});
  var allAimg=n>0&&sel.every(function(x){return x.encrypted;});
  ctxItem('encrypt').style.display=allPlain?'':'none';
  ctxItem('decrypt').style.display=allAimg?'':'none';
  ctxItem('rename').textContent=(n>1)?'Rename (Batch...)':'Rename';
  ctxItem('fullscreen').classList.toggle('disabled',n===0);
  // Paste only appears while the internal clipboard actually holds files.
  var paste=ctxItem('paste');
  if(paste){
    var clip=(state.clipboard&&state.clipboard.paths)?state.clipboard.paths.length:0;
    paste.style.display=clip?'':'none';
    paste.textContent=clip?('Paste ('+clip+')'):'Paste';
  }
}
function populateAddGroup(){
  var host=document.getElementById('ctxAddGroup');
  if(!groupsState.list.length){host.innerHTML='<div class="ctx-empty">Belum ada group</div>';return;}
  host.innerHTML=groupsState.list.map(function(g){
    return '<div class="ctx-item" data-act="addgroup-item" data-gid="'+g.id+'">'+esc(g.name)+'</div>';
  }).join('');
}
function populateRemoveGroup(){
  var host=document.getElementById('ctxRemoveGroup');
  var idx=primarySelectedIndex();
  if(idx==null){host.innerHTML='<div class="ctx-empty">Tidak ada file terpilih</div>';return;}
  var img=state.images[idx];
  host.innerHTML='<div class="ctx-empty">Memuat...</div>';
  getJSON('/api/groups/for?path='+encodeURIComponent(img.path)).then(function(res){
    var groups=(res.data&&res.data.groups)||[];
    if(!groups.length){host.innerHTML='<div class="ctx-empty">Tidak ada group</div>';return;}
    host.innerHTML=groups.map(function(g){
      return '<div class="ctx-item" data-act="removegroup-item" data-gid="'+g.id+'">'+esc(g.name)+'</div>';
    }).join('');
  }).catch(function(){host.innerHTML='<div class="ctx-empty">Gagal memuat</div>';});
}
ctxMenu.querySelectorAll('.ctx-item.has-sub').forEach(function(item){
  item.addEventListener('mouseenter',function(){
    ctxMenu.querySelectorAll('.ctx-item.open').forEach(function(o){if(o!==item)o.classList.remove('open');});
    item.classList.add('open');
    var r=item.getBoundingClientRect();
    if(r.right+180>window.innerWidth)item.classList.add('left');else item.classList.remove('left');
    if(item.dataset.act==='addgroup')populateAddGroup();
    else if(item.dataset.act==='removegroup')populateRemoveGroup();
  });
});
function handleContextAction(act){
  if(act==='fullscreen'){var i=primarySelectedIndex();if(i!=null)openFullScreen(i);}
  else if(act==='batch-rename')openBatchRenameDialog();
  else if(act==='encrypt')openCryptoFilesDialog('encrypt');
  else if(act==='decrypt')openCryptoFilesDialog('decrypt');
  else if(act==='copytarget')openTargetFolderDialog('copy');
  else if(act==='movetarget')openTargetFolderDialog('move');
  else if(act==='copy')setClipboard('copy');
  else if(act==='cut')setClipboard('cut');
  else if(act==='paste')pasteClipboard();
  else if(act==='remove')removeSelectedFiles();
  else if(act==='newfolder')openNewFolderDialog();
  else if(act==='rename'){if(state.selection.length>1)openBatchRenameDialog();else openRenameDialog();}
}
ctxMenu.addEventListener('click',function(e){
  var item=e.target.closest?e.target.closest('.ctx-item'):null;
  if(!item||!ctxMenu.contains(item))return;
  if(item.classList.contains('has-sub'))return;
  var act=item.dataset.act;
  if(act==='addgroup-item'){addSelectionToGroup(Number(item.dataset.gid));hideContextMenu();return;}
  if(act==='removegroup-item'){removeSelectionFromGroup(Number(item.dataset.gid));hideContextMenu();return;}
  handleContextAction(act);
  hideContextMenu();
});
function showContextMenu(e,index){
  if(index!=null&&state.selection.indexOf(index)<0){
    state.selection=[index];state.anchor=index;state.selected=index;
    applySelectionClasses();updateStatus();updateStatusFile();
  }
  ctxMenu.querySelectorAll('.ctx-item.open').forEach(function(o){o.classList.remove('open');});
  buildContextMenu();
  ctxMenu.classList.add('show');
  var w=ctxMenu.offsetWidth,h=ctxMenu.offsetHeight;
  var x=e.clientX,y=e.clientY;
  if(x+w>window.innerWidth-2)x=Math.max(0,window.innerWidth-w-2);
  if(y+h>window.innerHeight-2)y=Math.max(0,window.innerHeight-h-2);
  ctxMenu.style.left=x+'px';ctxMenu.style.top=y+'px';
}
function hideContextMenu(){
  ctxMenu.classList.remove('show');
  ctxMenu.querySelectorAll('.ctx-item.open').forEach(function(o){o.classList.remove('open');});
}
document.addEventListener('contextmenu',function(e){
  e.preventDefault();
  var card=e.target&&e.target.closest?e.target.closest('.card'):null;
  var idx=card?Number(card.dataset.index):null;
  if(idx==null){
    var inGrid=e.target&&e.target.closest&&e.target.closest('.grid');
    if(!inGrid){hideContextMenu();return;}
  }
  showContextMenu(e,idx);
});
document.addEventListener('click',function(e){
  if(!ctxMenu.contains(e.target))hideContextMenu();
},true);

// -- extra keyboard shortcuts (escape / clipboard) ------------------------
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){hideContextMenu();hideAllDialogs();closeFullScreen();return;}
  if(isEditableTarget(e.target))return;
  if(anyDialogVisible())return;
  if(e.key==='Delete'){if(state.selection.length){e.preventDefault();removeSelectedFiles();}return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==='a'||e.key==='A')){
    if(state.images.length){
      e.preventDefault();
      state.selection=state.images.map(function(_,idx){return idx;});
      state.anchor=0;state.selected=state.selection[state.selection.length-1];
      applySelectionClasses();updateStatus();updateStatusFile();
    }
  }
  else if((e.ctrlKey||e.metaKey)&&(e.key==='c'||e.key==='C')){if(state.selection.length){e.preventDefault();setClipboard('copy');}}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='x'||e.key==='X')){if(state.selection.length){e.preventDefault();setClipboard('cut');}}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='v'||e.key==='V')){e.preventDefault();pasteClipboard();}
});

// -- boot ------------------------------------------------------------------
loadGroups();
getJSON('/api/config').then(function(res){
  var cfg=res.data||{};
  if(cfg.crypto){setCryptoStatus(cfg.crypto);}
  loadTree();
  openFolder(cfg.default_path||null);
}).catch(function(){
  loadTree();
  openFolder(null);
});
})();
</script></body></html>
