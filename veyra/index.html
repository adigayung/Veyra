<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veyra</title>
<link rel="icon" href="data:,">
<!-- Stylesheets: loaded in dependency order (tokens -> shell -> features). -->
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/explorer.css">
<link rel="stylesheet" href="/static/css/grid.css">
<link rel="stylesheet" href="/static/css/groups.css">
<link rel="stylesheet" href="/static/css/context-menu.css">
<link rel="stylesheet" href="/static/css/dialogs.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<main class="app">

  <!-- Menu strip (visual only: each entry shows a toast). -->
  <nav class="menu"></nav>

  <!-- Toolbar: view actions on the left, dataset controls, layout on the right. -->
  <section class="toolbar">
    <button class="tool" title="Open">📂</button>
    <button class="tool" title="Save">💾</button>
    <button class="tool" title="Print">🖨️</button>
    <i class="sep"></i>
    <button class="tool" data-action="zoom in" title="Zoom In">🔍＋</button>
    <button class="tool" data-action="zoom out" title="Zoom Out">🔍－</button>
    <select class="zoom" title="Zoom level">
      <option>25%</option><option>50%</option><option>100%</option>
    </select>
    <i class="sep"></i>
    <button class="tool" id="btnAimg" title="Enkripsi/Dekripsi &amp; Crypto Session">🔐</button>
    <label class="sortby-label" for="sortBy">Sort By</label>
    <select id="sortBy" class="sortby" title="Sort By — urutkan Image Grid/Thumbnail View">
      <option value="date_desc">Date</option>
      <option value="date_asc">(Date)</option>
      <option value="name_asc" selected>File Name</option>
      <option value="name_desc">(File Name)</option>
      <option value="size_desc">File Size</option>
      <option value="size_asc">(File Size)</option>
    </select>
    <label class="groupfilter-label" for="groupFilter">Group</label>
    <select id="groupFilter" class="groupfilter" title="Group — filter Image Grid berdasarkan group (Normal = folder/drive aktif)">
      <option value="">Normal</option>
    </select>
    <span class="spacer"></span>
    <button class="tool" data-action="grid view" title="Thumbnails">▦</button>
    <button class="tool" data-action="list view" title="List">▤</button>
    <button class="tool" data-action="fullscreen" title="Full Screen">⛶</button>
  </section>

  <!-- Address bar: history navigation + editable path + refresh. -->
  <section class="address">
    <button class="nav" id="navBack" title="Back">←</button>
    <button class="nav" id="navForward" title="Forward">→</button>
    <button class="nav" id="navUp" title="Up">↑</button>
    <div class="path">
      <b>📁</b>
      <input id="pathInput" class="path-input" type="text" spellcheck="false" autocomplete="off" placeholder="Ketik path folder lalu tekan Enter">
    </div>
    <button class="nav" id="refreshBtn" title="Refresh">↻</button>
  </section>

  <!-- Body: sidebar (File Explorer only) on the left, viewer on the right.
       The GROUPS panel was removed from the sidebar: the left column now holds
       just the File Explorer tree and fills the whole panel height.  The Group
       subsystem is still fully available from the toolbar Group selector and
       the file context menu (Add to / Remove from Group). -->
  <div class="body">
    <aside class="sidebar">
      <div class="explorer">
        <div class="explorer-head">
          <span class="explorer-head-dot"></span>
          <span>File Explorer</span>
          <span class="explorer-head-meta" id="explorerMeta"></span>
        </div>
        <div class="explorer-body" id="explorerBody">
          <ul class="tree" id="tree"></ul>
        </div>
      </div>
    </aside>
    <section class="viewer">
      <div class="view-head">
        <span>Images</span>
        <span class="count" id="viewCount">0 items</span>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <footer class="status">
    <div class="file" id="statusFile">No image selected</div>
    <div class="pill" id="statusFolders">0 Folders</div>
    <div class="pill" id="statusFiles">0 Files (0 B)</div>
    <div class="pill" id="selectedStatus">0 Selected</div>
  </footer>

</main>

<div class="toast" id="toast"></div>

<!-- Centralized login overlay (startup + idle auto-lock). Password-only,
     shown on top of the mounted app body so an auto-lock never destroys
     navigation/selection state. Hidden by default via the .hidden class. -->
<div class="login-overlay hidden" id="loginOverlay">
  <div class="login-box">
    <h1>VEYRA</h1>
    <p class="login-sub" id="loginSub">Masukkan password untuk membuka session</p>
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="off" spellcheck="false" placeholder="Password">
    <button id="loginBtn" type="button">Login</button>
    <div class="login-status" id="loginStatus"></div>
    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<!-- Application JavaScript, split by feature.  All modules share ONE global
     scope (no bundler / no ES modules), so they are plain module scripts that
     must be loaded in dependency order: core first, then features, then the
     interaction layer and finally the boot sequence. -->
<script src="/static/js/core/state.js"></script>
<script src="/static/js/core/api.js"></script>
<script src="/static/js/core/dom.js"></script>
<script src="/static/js/core/session.js"></script>
<script src="/static/js/modules/grid.js"></script>
<script src="/static/js/modules/sort.js"></script>
<script src="/static/js/modules/explorer.js"></script>
<script src="/static/js/modules/selection.js"></script>
<script src="/static/js/modules/group.js"></script>
<script src="/static/js/modules/aimg.js"></script>
<script src="/static/js/modules/dialogs.js"></script>
<script src="/static/js/modules/fileops.js"></script>
<script src="/static/js/modules/viewer.js"></script>
<script src="/static/js/modules/contextmenu.js"></script>
<script src="/static/js/modules/shortcuts.js"></script>
<script src="/static/js/boot.js"></script>

</body>
</html>
